<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>30-text-shadow</title>
    <link rel="stylesheet" href="../css/master.css">
    <style>
        section {
            p.txt {
                font-size: 2rem;
                margin-block: 4rem;
                text-align: center;

                &.txt1 {
                    color: black;
                    text-shadow: 0 0 6px yellow;
                }

                &.txt2 {
                    color: yellow;
                    text-shadow: -4px -4px 6px white;
                }

                &.txt3 {
                    color: #4d434377;
                    font-size: 100px;
                    text-shadow:    
                    0 1px 0 #fff,
                    0 2px 0 #fff,
	                0 2px 0 #fff,
	                0 3px 0 #fff,
	                0 4px 0 #fff,
	                0 5px 0 #fff,
	                0 6px 0 #fff,
	                0 7px 0 #fff,
	                0 8px 0 #fff,
	                0 0 5px rgba(0,0,0,.05),
	                0 1px 3px rgba(0,0,0,.2),
	                0 3px 5px rgba(0,0,0,.2),
	                0 5px 10px rgba(0,0,0,.2),
	                0 10px 10px rgba(0,0,0,.2),
	                0 20px 20px rgba(0,0,0,.3);
                    }

                    &.txt4{
                        color: white;
                        font-size: 4rem;
                        text-shadow: 3px 6px 0 blue ;
                    }
            }
        }
</style>
</head>
