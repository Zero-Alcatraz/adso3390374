<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>45-challenge-grid</title>
    <style>
        body {
            background-color: #141414;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .cuadro-gigante {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 700px;
            margin: 0 auto;
            padding: 10px;
            background-color: #8fb8e8;
        }

        .cuadros {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-auto-rows: 170px;
            gap: 10px;
        }

        .cuadros2 {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-auto-rows: 150px;
            gap: 10px;
        }

        .cuadro {
            position: relative;
            display: flex;
            align-items: flex-end;
            padding: 8px;
            overflow: hidden;
            border-radius: 6px;
            background-color: #222;
        }

        .cuadro img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .cuadro span {
            position: relative;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            font-size: 13px;
            padding: 3px 8px;
            border-radius: 10px;
        }

        .alto {
            grid-row: span 2;
        }

        .ancho {
            grid-column: span 2;
        }

        .grande {
            grid-column: span 2;
            grid-row: span 2;
        }
    </style>
</head>

<body>

    <div class="cuadro-gigante">
        <div class="cuadros">
            <div class="cuadro">
                <img src="imgs/grid/ani01.png" alt="Imagen 1">
            </div>

            <div class="cuadro alto">
                <img src="imgs/grid/ani02.png" alt="Imagen 2">
            </div>

            <div class="cuadro">
                <img src="imgs/grid/ani03.png" alt="Imagen 3">
            </div>

            <div class="cuadro">
                <img src="imgs/grid/ani04.png" alt="Imagen 4">
            </div>

            <div class="cuadro">
                <img src="imgs/grid/ani05.png" alt="Imagen 5">
            </div>

            <div class="cuadro ancho">
                <img src="imgs/grid/ani06.png" alt="Imagen 6">
            </div>

            <div class="cuadro">
                <img src="imgs/grid/ani07.png" alt="Imagen 7">
            </div>
        </div>

        <div class="cuadros2">
            <div class="cuadro grande">
                <img src="imgs/grid/ani01.png" alt="Imagen 1">
            </div>

            <div class="cuadro">
                <img src="imgs/grid/ani02.png" alt="Imagen 2">
            </div>

            <div class="cuadro">
                <img src="imgs/grid/ani03.png" alt="Imagen 3">
            </div>

            <div class="cuadro grande">
                <img src="imgs/grid/ani04.png" alt="Imagen 4">
            </div>

            <div class="cuadro">
                <img src="imgs/grid/ani05.png" alt="Imagen 5">
            </div>

            <div class="cuadro">
                <img src="imgs/grid/ani06.png" alt="Imagen 6">
            </div>
        </div>
    </div>

</body>

</html>
