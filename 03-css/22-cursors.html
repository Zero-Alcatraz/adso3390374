<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>22-cursors</title>
    <link rel="stylesheet" href="../css/master.css">
    <style>
        section {
            div {
                background-color: #0003;
                border: 2px solid #fff3;
                margin: 1rem auto;
                height: 140px;
                width: 320px;
                &.cursor-move {
                    cursor: move;
                }
                &.cursor-help {
                    cursor: help;
                }
                &.cursor-crosshair {
                    cursor: crosshair;
                }
                &.cursor-image {
                    cursor: url(../src/imgs/pointer.png), pointer;
                }
            }
        }
    </style>
</head>
<body class="css">
    <a href="index.html" class="btn-home">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#000000" viewBox="0 0 256 256"><path d="M219.31,108.68l-80-80a16,16,0,0,0-22.62,0l-80,80A15.87,15.87,0,0,0,32,120v96a8,8,0,0,0,8,8h64a8,8,0,0,0,8-8V160h32v56a8,8,0,0,0,8,8h64a8,8,0,0,0,8-8V120A15.87,15.87,0,0,0,219.31,108.68ZM208,208H160V152a8,8,0,0,0-8-8H104a8,8,0,0,0-8,8v56H48V120l80-80,80,80Z"></path></svg>
    </a>
        <main>
        <header class="mainmenu">
            <h1>22-cursors</h1>
            <h4>Specifies the mouse cursor to be displayed when pointing over an element.</h4>
        </header>
        <section>
            <h4>Move:</h4>
            <div class="cursor-move"></div>
            <h4>Help:</h4>
            <div class="cursor-help"></div>
            <h4>Crosshair:</h4>
            <div class="cursor-crosshair"></div>
            <h4>Image (Custom):</h4>
            <div class="cursor-image"></div>
        </section>
    </main>
</body>
</html>
