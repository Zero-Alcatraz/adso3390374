<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>35 - Transformations</title>
    <link rel="stylesheet" href="../css/master.css">
    <style>
        section{
            img{
                display: block;
                margin: 1rem auto;

                &.transform1 {
                    transform: rotate(0.25turn); /*90deg*/
                }
                &.transform2 {
                    transform: scale(.5);
                }
                &.transform3 {
                    transform: translateX(-100px);
                }
                &.transform4 {
                    transform: skew(30deg);
                }
                &.transform5 {
                    transform: rotate(-45deg) scale(1.2);
                }

            }
        }
    </style>
</head>
<body class="css">
    <a href="index.html" class="btn-home">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#000000" viewBox="0 0 256 256"><path d="M219.31,108.68l-80-80a16,16,0,0,0-22.62,0l-80,80A15.87,15.87,0,0,0,32,120v96a8,8,0,0,0,8,8h64a8,8,0,0,0,8-8V160h32v56a8,8,0,0,0,8,8h64a8,8,0,0,0,8-8V120A15.87,15.87,0,0,0,219.31,108.68ZM208,208H160V152a8,8,0,0,0-8-8H104a8,8,0,0,0-8,8v56H48V120l80-80,80,80Z"></path></svg>
    </a>
        <main>
        <header class="mainmenu">
            <h1>35 - Transformations</h1>
            <h4>Property (transform) allowing 2D or 3D manipulation of elements, such as translate(), rotate(), scale(), and skew().</h4>
        </header>
        <section>
            <h4>Rotate: 90deg</h4>
            <img class="transform1" src="imgs/mario-body.png" width="180px">
            <h4>Scale: 0.5</h4>
            <img class="transform2" src="imgs/mario-body.png" width="180px">
            <h4>TranslateX: -100px</h4>
            <img class="transform3" src="imgs/mario-body.png" width="180px">
            <h4>Skew: 30deg</h4>
            <img class="transform4" src="imgs/mario-body.png" width="180px">
            <h4>Rotate Scale:</h4>
            <img class="transform5" src="imgs/mario-body.png" width="180px">
        </section>
    </main>
</body>
</html>
