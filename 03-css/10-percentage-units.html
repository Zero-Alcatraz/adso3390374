<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10 - Percentage Units</title>
    <link rel="stylesheet" href="../css/master.css">
    <style>
        body main {
            width: 100%;
        }

        section.percentage {
            width: 80%;
        }

        div.parent {
            align-items: center;
            display: flex;
            justify-content: center;
        }

        div.parent div {
            align-items: center;
            display: flex;
            font-size: 2rem;
            justify-content: center;
            height: 50dvh;
        }

        div.parent div.child1 {
            background-color: blueviolet;
            width: 70%;
        }

        div.parent div.child2 {
            background-color: lightseagreen;
            width: 30%;
        }
    </style>
</head>
<body class="css">
    <a href="index.html" class="btn-home">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#000000" viewBox="0 0 256 256"><path d="M219.31,108.68l-80-80a16,16,0,0,0-22.62,0l-80,80A15.87,15.87,0,0,0,32,120v96a8,8,0,0,0,8,8h64a8,8,0,0,0,8-8V160h32v56a8,8,0,0,0,8,8h64a8,8,0,0,0,8-8V120A15.87,15.87,0,0,0,219.31,108.68ZM208,208H160V152a8,8,0,0,0-8-8H104a8,8,0,0,0-8,8v56H48V120l80-80,80,80Z"></path></svg>
    </a>
    <main>
        <header class="mainmenu">
            <h1>10 - Percentage Units</h1>
            <h3>Are relative to the size of the parent element.</h3>
        </header>
        <main>
            <section class="percentage">
                <div class="parent">
                    <div class="child1">70%</div>
                    <div class="child2">30%</div>
                </div>
            </section>
        </main>
</body>

</html>
