<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>23-Sprite</title>
    <link rel="stylesheet" href="../css/master.css">
    <style>
        div#runner {
            background: url(../src/imgs/run-sprite.png) no-repeat;
            height: 256px;
            margin: 1rem auto;
            width: 256px;
            &.sp1{ background-position: calc(-256px * 0) 0;  }
            &.sp2{ background-position: calc(-256px * 1) 0;  }
            &.sp3{ background-position: calc(-256px * 2) 0;  }
            &.sp4{ background-position: calc(-256px * 3) 0;  }
            &.sp5{ background-position: calc(-256px * 4) 0;  }
            &.sp6{ background-position: calc(-256px * 5) 0;  }
        }
        div#dino {
            background: url(../src/imgs/dino-sprite.png) no-repeat;
            height: 128px;
            margin: 1rem auto;
            width: 128px;
            &.sp1{ background-position: calc(-128px * 0) 0;  }
            &.sp2{ background-position: calc(-128px * 1) 0;  }
            &.sp3{ background-position: calc(-128px * 2) 0;  }
            &.sp4{ background-position: calc(-128px * 3) 0;  }
            &.sp5{ background-position: calc(-128px * 4) 0;  }
            &.sp6{ background-position: calc(-128px * 5) 0;  }
        }
    </style>
</head>
<body class="css">
    <a href="index.html" class="btn-home">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#000000" viewBox="0 0 256 256"><path d="M219.31,108.68l-80-80a16,16,0,0,0-22.62,0l-80,80A15.87,15.87,0,0,0,32,120v96a8,8,0,0,0,8,8h64a8,8,0,0,0,8-8V160h32v56a8,8,0,0,0,8,8h64a8,8,0,0,0,8-8V120A15.87,15.87,0,0,0,219.31,108.68ZM208,208H160V152a8,8,0,0,0-8-8H104a8,8,0,0,0-8,8v56H48V120l80-80,80,80Z"></path></svg>
    </a>
        <main>
        <header class="mainmenu">
            <h1>23-Sprite</h1>
            <h4>An image sprite is a collection of images put into a single image.</h4>
        </header>
        <section>
            <h4>Runner:</h4>
            <div class="sp1" id="runner"></div>
            <h4>Dino:</h4>
            <div class="sp1" id="dino"></div>
        </section>
    </main>
</body>
<script>
        const runner = document.getElementById('runner');
        const dino   = document.getElementById('dino');
        const runnerSprites = 6;
        const dinoSprites   = 2;
        let countRunner = 1;
        let countDino   = 1;

        setInterval(() => {
            runner.className = '';
            runner.classList.add('sp'+countRunner);
            if(countRunner == runnerSprites) countRunner = 1
            else countRunner++
        }, 80);

        setInterval(() => {
            dino.className = '';
            dino.classList.add('sp'+countDino);
            if(countDino == dinoSprites) countDino = 1
            else countDino++
        }, 80);
    </script>
</html>
